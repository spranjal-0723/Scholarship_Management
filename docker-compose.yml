version: "3.8"

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: scholarship-neo4j
    environment:
      - NEO4J_AUTH=neo4j/scholarship123
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p scholarship123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarship-backend
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=scholarship123
      - NEO4J_DATABASE=neo4j
    ports:
      - "5000:5000"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
