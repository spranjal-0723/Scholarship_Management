services:
  - type: web
    name: scholarship-fee-management
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "backend.app:app" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: APP_DATABASE_MODE
        value: neo4j
      - key: FLASK_DEBUG
        value: "false"
      - key: DEMO_READ_ONLY
        value: "true"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DEMO_ADMIN_EMAIL
        value: admin@scholarship.demo
      - key: DEMO_ADMIN_PASSWORD
        value: Demo@12345
