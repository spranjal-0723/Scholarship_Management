<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#0b132b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#141c33" />
    </linearGradient>
  </defs>

  <!-- Browser Header -->
  <rect x="0" y="0" width="1200" height="42" fill="#141c33"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>
  <rect x="200" y="8" width="800" height="26" rx="13" fill="#0b132b" stroke="#2a375a"/>
  <text x="600" y="25" fill="#94a3b8" font-size="12" text-anchor="middle">http://127.0.0.1:5050/app#diagnostics (System Diagnostics &amp; Polyglot Health)</text>

  <!-- Sidebar -->
  <rect x="0" y="42" width="220" height="708" fill="#141c33" stroke-width="1" stroke="#1e293b"/>
  <text x="24" y="80" fill="#00b4d8" font-size="16" font-weight="800">ScholarshipSync</text>
  <text x="44" y="144" fill="#94a3b8" font-size="13">📊 Overview</text>
  <text x="44" y="184" fill="#94a3b8" font-size="13">👥 Students</text>
  <text x="44" y="224" fill="#94a3b8" font-size="13">🎓 Scholarships</text>
  <text x="44" y="264" fill="#94a3b8" font-size="13">💳 Fees &amp; Dues</text>
  <text x="44" y="304" fill="#94a3b8" font-size="13">💵 Payments</text>
  <text x="44" y="344" fill="#94a3b8" font-size="13">🏦 Disbursements</text>
  <text x="44" y="384" fill="#94a3b8" font-size="13">🕸️ Graph Explorer</text>
  <rect x="12" y="400" width="196" height="38" rx="8" fill="#00b4d8" fill-opacity="0.15" stroke="#00b4d8" stroke-width="1"/>
  <text x="44" y="424" fill="#00b4d8" font-size="13" font-weight="700">⚙️ Diagnostics</text>

  <!-- Page Header -->
  <text x="250" y="85" fill="#ffffff" font-size="22" font-weight="800">System Diagnostics &amp; Health Telemetry</text>
  <text x="250" y="105" fill="#94a3b8" font-size="13">Live verification of database connectivity, session security, and automated regression suite</text>

  <!-- Diagnostic Grid -->
  <!-- Card 1: Flask Application -->
  <rect x="250" y="130" width="440" height="150" rx="12" fill="url(#cardGrad)" stroke="#1e293b"/>
  <circle cx="280" cy="165" r="14" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="280" cy="165" r="6" fill="#10b981"/>
  <text x="310" y="170" fill="#ffffff" font-size="16" font-weight="700">Flask Backend Engine (Python 3.11)</text>
  <text x="280" y="208" fill="#cbd5e1" font-size="12">Port: <tspan fill="#ffffff" font-weight="600">5050 (Active)</tspan> | Base: <tspan fill="#ffffff">http://127.0.0.1:5050</tspan></text>
  <text x="280" y="230" fill="#cbd5e1" font-size="12">Security: <tspan fill="#10b981" font-weight="600">CSRF Enabled</tspan> · <tspan fill="#10b981" font-weight="600">HttpOnly Session</tspan> · <tspan fill="#10b981" font-weight="600">PBKDF2 Hashing</tspan></text>
  <text x="280" y="252" fill="#94a3b8" font-size="11">Status: Operational · 0 Critical Warnings</text>

  <!-- Card 2: Oracle Database -->
  <rect x="720" y="130" width="440" height="150" rx="12" fill="url(#cardGrad)" stroke="#1e293b"/>
  <circle cx="750" cy="165" r="14" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="750" cy="165" r="6" fill="#10b981"/>
  <text x="780" y="170" fill="#ffffff" font-size="16" font-weight="700">Oracle Database 23ai Free</text>
  <text x="750" y="208" fill="#cbd5e1" font-size="12">Connection: <tspan fill="#ffffff" font-weight="600">oracledb://SYSTEM@localhost:1521/FREEPDB1</tspan></text>
  <text x="750" y="230" fill="#cbd5e1" font-size="12">Relational Assets: <tspan fill="#38bdf8" font-weight="600">12 Tables</tspan> · <tspan fill="#38bdf8" font-weight="600">5 Views</tspan> · <tspan fill="#38bdf8" font-weight="600">4 PL/SQL Units</tspan></text>
  <text x="750" y="252" fill="#10b981" font-size="11">Latency: 4.8 ms · ACID Enforcement Active</text>

  <!-- Card 3: Neo4j Graph Database -->
  <rect x="250" y="300" width="440" height="150" rx="12" fill="url(#cardGrad)" stroke="#1e293b"/>
  <circle cx="280" cy="335" r="14" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="280" cy="335" r="6" fill="#10b981"/>
  <text x="310" y="340" fill="#ffffff" font-size="16" font-weight="700">Neo4j Graph Database 5.26</text>
  <text x="280" y="378" fill="#cbd5e1" font-size="12">Protocol: <tspan fill="#ffffff" font-weight="600">bolt://localhost:7687</tspan> (neo4j-python-driver)</text>
  <text x="280" y="400" fill="#cbd5e1" font-size="12">Graph Topology: <tspan fill="#38bdf8" font-weight="600">94 Nodes</tspan> · <tspan fill="#38bdf8" font-weight="600">118 Directed Relationships</tspan></text>
  <text x="280" y="422" fill="#10b981" font-size="11">Schema Constraints: 12 Unique Business Key Constraints Verified</text>

  <!-- Card 4: Automated Test Suite -->
  <rect x="720" y="300" width="440" height="150" rx="12" fill="url(#cardGrad)" stroke="#1e293b"/>
  <circle cx="750" cy="335" r="14" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="750" cy="335" r="6" fill="#10b981"/>
  <text x="780" y="340" fill="#ffffff" font-size="16" font-weight="700">Automated Regression Verification</text>
  <text x="750" y="378" fill="#cbd5e1" font-size="12">Pytest Suite: <tspan fill="#10b981" font-weight="700">180 PASSED / 180 (100% Pass Rate)</tspan></text>
  <text x="750" y="400" fill="#cbd5e1" font-size="12">Coverage: Auth (45), Oracle API (48), Neo4j (52), Integration (35)</text>
  <text x="750" y="422" fill="#10b981" font-size="11">Execution Time: 1.77s · Zero Regressions Detected</text>

  <!-- Bottom Terminal / Diagnostic Output Box -->
  <rect x="250" y="470" width="910" height="250" rx="12" fill="#070c1a" stroke="#1e293b"/>
  <text x="274" y="500" fill="#ffffff" font-size="14" font-weight="700">Live Health Probe Output (GET /api/health)</text>

  <rect x="270" y="515" width="870" height="185" rx="8" fill="#0b132b" stroke="#334155"/>
  <text x="285" y="540" fill="#10b981" font-size="11" font-family="monospace">HTTP/1.1 200 OK</text>
  <text x="285" y="558" fill="#38bdf8" font-size="11" font-family="monospace">Content-Type: application/json; charset=utf-8</text>
  <text x="285" y="580" fill="#cbd5e1" font-size="11" font-family="monospace">{</text>
  <text x="305" y="598" fill="#cbd5e1" font-size="11" font-family="monospace">  "status": "healthy",</text>
  <text x="305" y="616" fill="#cbd5e1" font-size="11" font-family="monospace">  "active_engine": "oracle",</text>
  <text x="305" y="634" fill="#cbd5e1" font-size="11" font-family="monospace">  "services": { "flask": "running", "oracle": "connected", "neo4j": "connected" },</text>
  <text x="305" y="652" fill="#cbd5e1" font-size="11" font-family="monospace">  "auth": { "csrf": "active", "demo_account": "configured" },</text>
  <text x="305" y="670" fill="#cbd5e1" font-size="11" font-family="monospace">  "graph": { "nodes": 94, "relationships": 118, "status": "synced" }</text>
  <text x="285" y="688" fill="#cbd5e1" font-size="11" font-family="monospace">}</text>
</svg>
