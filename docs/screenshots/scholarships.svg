  <text x="274" y="424" fill="#00b4d8" font-size="13" font-weight="700">A005</text>
  <text x="350" y="424" fill="#ffffff" font-size="13">Vikram Singh (S005)</text>
  <text x="480" y="424" fill="#94a3b8" font-size="12">20-Feb-2026</text>
