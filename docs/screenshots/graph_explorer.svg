<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#0b132b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#141c33" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Browser Header -->
  <rect x="0" y="0" width="1200" height="42" fill="#141c33"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>
  <rect x="200" y="8" width="800" height="26" rx="13" fill="#0b132b" stroke="#2a375a"/>
  <text x="600" y="25" fill="#94a3b8" font-size="12" text-anchor="middle">http://127.0.0.1:5050/app#graph (Neo4j Graph Explorer &amp; Cytoscape Visualizer)</text>

  <!-- Sidebar -->
  <rect x="0" y="42" width="220" height="708" fill="#141c33" stroke-width="1" stroke="#1e293b"/>
  <text x="24" y="80" fill="#00b4d8" font-size="16" font-weight="800">ScholarshipSync</text>
  <text x="44" y="144" fill="#94a3b8" font-size="13">📊 Overview</text>
  <text x="44" y="184" fill="#94a3b8" font-size="13">👥 Students</text>
  <text x="44" y="224" fill="#94a3b8" font-size="13">🎓 Scholarships</text>
  <text x="44" y="264" fill="#94a3b8" font-size="13">💳 Fees &amp; Dues</text>
  <text x="44" y="304" fill="#94a3b8" font-size="13">💵 Payments</text>
  <text x="44" y="344" fill="#94a3b8" font-size="13">🏦 Disbursements</text>
  <rect x="12" y="360" width="196" height="38" rx="8" fill="#00b4d8" fill-opacity="0.15" stroke="#00b4d8" stroke-width="1"/>
  <text x="44" y="384" fill="#00b4d8" font-size="13" font-weight="700">🕸️ Graph Explorer</text>
  <text x="44" y="424" fill="#94a3b8" font-size="13">⚙️ Diagnostics</text>

  <!-- Top Controls Bar -->
  <rect x="240" y="55" width="935" height="52" rx="8" fill="#141c33" stroke="#1e293b"/>
  <text x="255" y="86" fill="#ffffff" font-size="13" font-weight="700">PRESETS:</text>
  
  <rect x="330" y="66" width="130" height="30" rx="6" fill="#00b4d8" fill-opacity="0.2" stroke="#00b4d8"/>
  <text x="395" y="86" fill="#00b4d8" font-size="12" font-weight="700" text-anchor="middle">Student Journey</text>

  <rect x="470" y="66" width="105" height="30" rx="6" fill="#1e293b"/>
  <text x="522" y="86" fill="#94a3b8" font-size="12" text-anchor="middle">Full Graph</text>

  <rect x="585" y="66" width="120" height="30" rx="6" fill="#1e293b"/>
  <text x="645" y="86" fill="#94a3b8" font-size="12" text-anchor="middle">Fee Liabilities</text>

  <rect x="715" y="66" width="125" height="30" rx="6" fill="#1e293b"/>
  <text x="777" y="86" fill="#94a3b8" font-size="12" text-anchor="middle">Scholarships</text>

  <text x="890" y="86" fill="#64748b" font-size="12">Student ID:</text>
  <rect x="960" y="66" width="80" height="30" rx="4" fill="#0b132b" stroke="#334155"/>
  <text x="1000" y="86" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">S001</text>

  <rect x="1050" y="66" width="110" height="30" rx="6" fill="#0077b6"/>
  <text x="1105" y="86" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Traverse ➔</text>

  <!-- Cytoscape Graph Canvas Area (Left 68%) -->
  <rect x="240" y="120" width="620" height="605" rx="12" fill="#070c1a" stroke="#1e293b"/>

  <!-- Graph Grid Dots Background -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1c2541"/>
  </pattern>
  <rect x="240" y="120" width="620" height="605" fill="url(#grid)" rx="12"/>

  <!-- GRAPH NODES & EDGES (Student Journey of S001) -->

  <!-- Edges -->
  <!-- Program -> Student -->
  <line x1="330" y1="230" x2="490" y2="340" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="2"/>
  <text x="390" y="275" fill="#60a5fa" font-size="10" font-weight="600">HAS_STUDENT</text>

  <!-- Department -> Program -->
  <line x1="330" y1="390" x2="330" y2="250" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="325" fill="#60a5fa" font-size="10">HAS_PROGRAM</text>

  <!-- Student -> StudentProfile -->
  <line x1="510" y1="360" x2="650" y2="230" stroke="#00b4d8" stroke-width="2"/>
  <text x="600" y="285" fill="#38bdf8" font-size="10">HAS_PROFILE</text>

  <!-- Student -> Application -->
  <line x1="520" y1="370" x2="680" y2="360" stroke="#10b981" stroke-width="2.5"/>
  <text x="590" y="355" fill="#34d399" font-size="10" font-weight="600">SUBMITTED</text>

  <!-- Application -> Scholarship -->
  <line x1="720" y1="360" x2="720" y2="480" stroke="#10b981" stroke-width="2.5"/>
  <text x="730" y="425" fill="#34d399" font-size="10" font-weight="600">AWARDS</text>

  <!-- Scholarship -> Disbursement -->
  <line x1="700" y1="510" x2="570" y2="590" stroke="#10b981" stroke-width="2"/>
  <text x="645" y="560" fill="#34d399" font-size="10">HAS_DISBURSEMENT</text>

  <!-- Student -> Fee -->
  <line x1="490" y1="390" x2="400" y2="490" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="415" y="445" fill="#fbbf24" font-size="10" font-weight="600">HAS_FEE</text>

  <!-- Fee -> Payment -->
  <line x1="400" y1="530" x2="440" y2="630" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="585" fill="#fbbf24" font-size="10">HAS_PAYMENT</text>

  <!-- NODES -->
  <!-- Dept Node -->
  <circle cx="330" cy="410" r="24" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="330" y="414" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Dept</text>
  <text x="330" y="445" fill="#94a3b8" font-size="10" text-anchor="middle">CSE</text>

  <!-- Program Node -->
  <circle cx="330" cy="225" r="26" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="330" y="229" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Program</text>
  <text x="330" y="262" fill="#94a3b8" font-size="10" text-anchor="middle">B.Tech CSE</text>

  <!-- Central Student Node (Focal) -->
  <circle cx="500" cy="360" r="38" fill="#0369a1" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  <text x="500" y="358" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">Student</text>
  <text x="500" y="374" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">S001</text>
  <text x="500" y="410" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Rahul Sharma</text>

  <!-- Student Profile Node -->
  <circle cx="660" cy="220" r="22" fill="#0e7490" stroke="#22d3ee" stroke-width="2"/>
  <text x="660" y="224" fill="#ffffff" font-size="9" text-anchor="middle">Profile</text>

  <!-- Application Node -->
  <circle cx="700" cy="360" r="26" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="700" y="364" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">App</text>
  <text x="700" y="396" fill="#cbd5e1" font-size="10" text-anchor="middle">A001</text>

  <!-- Scholarship Node -->
  <circle cx="720" cy="500" r="28" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="720" y="504" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Schol</text>
  <text x="720" y="538" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">₹50,000</text>

  <!-- Disbursement Node -->
  <circle cx="560" cy="600" r="24" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="560" y="604" fill="#ffffff" font-size="9" text-anchor="middle">Disb</text>

  <!-- Fee Node -->
  <circle cx="390" cy="510" r="26" fill="#b45309" stroke="#fbbf24" stroke-width="2"/>
  <text x="390" y="514" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Fee</text>
  <text x="390" y="546" fill="#fbbf24" font-size="10" text-anchor="middle">₹75,000</text>

  <!-- Payment Node -->
  <circle cx="450" cy="645" r="24" fill="#b45309" stroke="#fbbf24" stroke-width="2"/>
  <text x="450" y="649" fill="#ffffff" font-size="9" text-anchor="middle">Pay</text>

  <!-- Node Inspector / Cypher Query Sidebar (Right 30%) -->
  <rect x="875" y="120" width="300" height="605" rx="12" fill="url(#cardGrad)" stroke="#1e293b"/>
  <text x="895" y="152" fill="#ffffff" font-size="15" font-weight="700">Selected Node Inspector</text>
  <text x="895" y="172" fill="#00b4d8" font-size="12">Label: :Student (studentId: "S001")</text>

  <!-- Node Properties Table -->
  <rect x="890" y="190" width="270" height="150" rx="8" fill="#0b132b" stroke="#1e293b"/>
  <text x="905" y="214" fill="#94a3b8" font-size="11">PROPERTY</text>
  <text x="1020" y="214" fill="#94a3b8" font-size="11">VALUE</text>
  
  <line x1="900" y1="222" x2="1150" y2="222" stroke="#1e293b"/>
  <text x="905" y="242" fill="#cbd5e1" font-size="11">studentId</text>
  <text x="1020" y="242" fill="#ffffff" font-size="11" font-weight="600">S001</text>

  <text x="905" y="266" fill="#cbd5e1" font-size="11">studentName</text>
  <text x="1020" y="266" fill="#ffffff" font-size="11" font-weight="600">Rahul Sharma</text>

  <text x="905" y="290" fill="#cbd5e1" font-size="11">phone</text>
  <text x="1020" y="290" fill="#ffffff" font-size="11">9876543210</text>

  <text x="905" y="314" fill="#cbd5e1" font-size="11">programId</text>
  <text x="1020" y="314" fill="#38bdf8" font-size="11">P001</text>

  <!-- Executed Cypher Query Box -->
  <text x="895" y="370" fill="#ffffff" font-size="13" font-weight="700">Executed Cypher Traversal</text>
  <rect x="890" y="380" width="270" height="110" rx="8" fill="#070c1a" stroke="#334155"/>
  <text x="900" y="405" fill="#38bdf8" font-size="10" font-family="monospace">MATCH (s:Student {studentId: 'S001'})</text>
  <text x="900" y="423" fill="#38bdf8" font-size="10" font-family="monospace">OPTIONAL MATCH (s)-[r]-(n)</text>
  <text x="900" y="441" fill="#38bdf8" font-size="10" font-family="monospace">OPTIONAL MATCH (n)-[r2]-(m)</text>
  <text x="900" y="459" fill="#38bdf8" font-size="10" font-family="monospace">RETURN s, r, n, r2, m LIMIT 50;</text>

  <!-- Performance Badge -->
  <rect x="890" y="510" width="270" height="70" rx="8" fill="#1e293b"/>
  <text x="905" y="534" fill="#10b981" font-size="12" font-weight="700">⚡ Index-Free Adjacency</text>
  <text x="905" y="552" fill="#cbd5e1" font-size="11">Traversal Latency: 2.4 ms</text>
  <text x="905" y="568" fill="#94a3b8" font-size="11">Nodes: 8 · Edges: 8 (Multi-Hop Join)</text>
</svg>
